# pyproject.toml

[project]
name = "taffmat"
version = "1.0.1"
description = "Read and write Teac TAFFmat files"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [{ name = "Matthew Rankin", email = "matthew@questrail.com" }]
requires-python = ">=3.12"
dependencies = ["numpy>=2.2.0"]
classifiers = [
  'Programming Language :: Python',
  'Programming Language :: Python :: 3',
  'Programming Language :: Python :: 3.12',
  'Programming Language :: Python :: 3.13',
  'Development Status :: 5 - Production/Stable',
  'Operating System :: OS Independent',
  'Intended Audience :: Developers',
  'Topic :: Software Development :: Libraries :: Python Modules',
]

[project.urls]
Homepage = "https://github.com/questrail/taffmat"
Issues = "https://github.com/questrail/taffmat/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taffmat"]

[tool.hatch.build.targets.sdist]
# Name what ships rather than taking hatchling's default of everything the
# .gitignore does not exclude, which would sweep in any scratch data sitting
# untracked in the working directory.
include = [
  "src",
  "tests",
  "CHANGELOG.md",
  "LICENSE.txt",
  "README.md",
  "pyproject.toml",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# Select rules explicitly rather than relying on ruff's defaults, so that the
# rule set is a deliberate choice. The ruff version itself is pinned by uv.lock.
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "SIM", # flake8-simplify
  "EXE", # flake8-executable
  "PL",  # pylint
  "PT",  # flake8-pytest-style
  "RUF", # ruff's own rules
]

[tool.ruff.lint.per-file-ignores]
# The suite is written against unittest.TestCase, so PT009 objects to every
# assertion in it. Converting it to plain pytest asserts is worth doing and is
# its own job, not a side effect of choosing a rule set.
"tests/**" = ["PT009", "PT027"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.0.3",
    "ruff>=0.16.5",
]
